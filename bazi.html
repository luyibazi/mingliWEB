    <link rel="stylesheet" href="style.css?v=20260930b">
    <style>
        /* 覆盖 style.css 中为主页面设计的 body 样式：
           padding:40px、min-height:100vh、flex 会导致 iframe 内部出现滚动条。
           本页作为 iframe 子页，高度必须完全由内容决定，滚动交给外层页面。 */

            min-height: 0 !important;
            padding: 0 !important;
            display: block !important;
            overflow: hidden;
            background: #f4f5f7;
        }
    </style>
</head>
